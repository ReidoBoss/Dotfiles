[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
prompt=  
terminal=foot
layer=overlay
exit-on-keyboard-focus-loss=yes
icon-theme=Papirus-Dark
icons-enabled=yes
fuzzy=yes
lines=8
width=35
horizontal-pad=16
vertical-pad=10
inner-pad=8

[colors]
background=0a0e14cc
text=ffffffd9
match=c4b5fdff
selection=7c3aed99
selection-text=e9d5ffff
selection-match=f5d0feff
border=ffffff12
placeholder=ffffff40

[border]
width=1
radius=14

[shadow]
# enable if your compositor supports shadows on layer-shell
# color=00000066
# offset-x=0
# offset-y=4
# size=16
